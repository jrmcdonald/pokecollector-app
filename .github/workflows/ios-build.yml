# Builds an unsigned IPA for AltStore to sign with a free Apple ID.
#
# Manual only. This repository is private, so macOS minutes come out of the
# account's allowance at ten times the Linux rate, and a build is only needed
# when native code changes: a new native dependency, an Expo SDK bump, or
# app.config.ts. JavaScript changes reach the dev build over Metro.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: development is the dev client (loads JS from Metro); production bundles the JS
        type: choice
        options: [development, production]
        default: development

permissions:
  contents: read

concurrency:
  group: ios-build-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: ${{ inputs.variant }}
      EXPO_NO_TELEMETRY: 1
      # The dev client needs Debug for its launcher; production is a Release build.
      CONFIGURATION: ${{ inputs.variant == 'production' && 'Release' || 'Debug' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Toolchain
        run: |
          xcodebuild -version
          pod --version

      - run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform ios --clean --no-install

      # Podfile.lock does not exist until pod install runs, so key on what
      # decides the pods: the npm lock file and the app config.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ inputs.variant }}-${{ hashFiles('package-lock.json', 'app.config.ts') }}

      - name: Install pods
        working-directory: ios
        run: pod install

      # Prebuild names the workspace and scheme after the app's display name,
      # which differs between variants ("PokeCollector Dev" → PokeCollectorDev).
      - name: Find the workspace and scheme
        id: project
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "${workspace}" .xcworkspace)
          if ! xcodebuild -list -json -workspace "${workspace}" \
               | jq -e --arg s "${scheme}" '.workspace.schemes | index($s)' > /dev/null; then
            echo "::error::Scheme ${scheme} not found in ${workspace}" >&2
            xcodebuild -list -workspace "${workspace}"
            exit 1
          fi
          echo "workspace=${workspace}" >> "$GITHUB_OUTPUT"
          echo "scheme=${scheme}" >> "$GITHUB_OUTPUT"

      # Unsigned: AltStore re-signs with the free Apple ID's certificate on the
      # PC, which is the only signing a free account can do.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "${{ steps.project.outputs.workspace }}" \
            -scheme "${{ steps.project.outputs.scheme }}" \
            -configuration "${CONFIGURATION}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E 'error:|\*\* ARCHIVE' || true
          test -d build/App.xcarchive/Products/Applications

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry "PokeCollector-${APP_VARIANT}.ipa" Payload
          ls -lh "PokeCollector-${APP_VARIANT}.ipa"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PokeCollector-${{ inputs.variant }}
          path: PokeCollector-${{ inputs.variant }}.ipa
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-log-${{ inputs.variant }}
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
