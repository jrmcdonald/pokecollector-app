# The simulator walkthrough, as an XcodeGen spec: CI runs `xcodegen generate`
# here, so no Xcode project is committed. The UI tests drive the real app by
# its bundle ID; the host app exists only because Xcode wants every UI test
# bundle to have one, and never runs.
name: Walkthrough
options:
  bundleIdPrefix: io.github.jrmcdonald.walkthrough
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    # Simulator only: signed to run locally, no team or App ID needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  Walkthrough:
    type: bundle.ui-testing
    platform: iOS
    sources: [Walkthrough]
    dependencies:
      - target: Host
schemes:
  Walkthrough:
    build:
      targets:
        Host: all
        Walkthrough: [test]
    test:
      targets: [Walkthrough]
